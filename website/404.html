<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #060612;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      animation: drift 12s ease-in-out infinite;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(239,68,68,0.35), transparent 70%);
      top: -200px; right: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(99,102,241,0.4), transparent 70%);
      bottom: -150px; left: -100px;
      animation-delay: -5s; animation-duration: 15s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(251,191,36,0.25), transparent 70%);
      top: 40%; left: 55%;
      animation-delay: -9s; animation-duration: 10s;
    }
    @keyframes drift {
      0%,100% { transform: translate(0,0) scale(1); }
      33%  { transform: translate(-25px, 35px) scale(1.08); }
      66%  { transform: translate(20px, -20px) scale(0.95); }
    }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.1; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.4); }
    }

    /* Noise */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35; z-index: 1; pointer-events: none;
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      width: min(480px, 92vw);
      padding: 52px 44px 44px;
      border-radius: 32px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(50px) saturate(160%);
      -webkit-backdrop-filter: blur(50px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow:
        0 0 0 1px rgba(239,68,68,0.15),
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -1px 0 rgba(255,255,255,0.04);
      animation: cardIn 1s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
      text-align: center;
    }

    /* Shine sweep */
    .card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 32px;
      background: linear-gradient(
        140deg,
        rgba(255,255,255,0.12) 0%,
        rgba(255,255,255,0.02) 35%,
        transparent 55%,
        rgba(255,255,255,0.04) 100%
      );
      pointer-events: none;
    }

    /* Colored rim */
    .card::after {
      content: '';
      position: absolute; inset: -1px;
      border-radius: 33px;
      background: linear-gradient(135deg, rgba(239,68,68,0.5), rgba(99,102,241,0.3), rgba(251,191,36,0.2));
      z-index: -1;
      filter: blur(1px);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(0.9); filter: blur(10px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* Big 404 */
    .big-404 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(72px, 18vw, 110px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, #ef4444 0%, #f472b6 40%, #818cf8 80%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(239,68,68,0.4));
      animation: glitch 6s infinite;
      position: relative;
    }

    @keyframes glitch {
      0%,95%,100% { transform: translate(0); filter: drop-shadow(0 0 30px rgba(239,68,68,0.4)); }
      96% { transform: translate(-3px, 1px); filter: drop-shadow(3px 0 0 rgba(56,189,248,0.8)) drop-shadow(-3px 0 0 rgba(239,68,68,0.8)); }
      97% { transform: translate(3px, -1px); filter: drop-shadow(-3px 0 0 rgba(56,189,248,0.8)) drop-shadow(3px 0 0 rgba(239,68,68,0.8)); }
      98% { transform: translate(0); filter: drop-shadow(0 0 30px rgba(239,68,68,0.4)); }
      99% { transform: translate(-2px, 0); filter: drop-shadow(2px 0 0 rgba(251,191,36,0.8)); }
    }

    /* Divider */
    .divider {
      margin: 20px auto;
      width: 60px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, rgba(239,68,68,0.8), rgba(99,102,241,0.8));
      box-shadow: 0 0 12px rgba(239,68,68,0.5);
    }

    /* Heading */
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 14px;
      color: rgba(255,255,255,0.38);
      line-height: 1.7;
      max-width: 320px;
      margin: 0 auto 32px;
    }

    /* Glass button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 50px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.85);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow:
        0 4px 16px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.25);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(99,102,241,0.15));
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 28px rgba(0,0,0,0.4),
        0 0 20px rgba(239,68,68,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
      border-color: rgba(239,68,68,0.4);
    }

    .btn:hover::before { opacity: 1; }

    .btn svg {
      width: 16px; height: 16px;
      fill: currentColor;
      transition: transform 0.25s ease;
    }
    .btn:hover svg { transform: translateX(-3px); }

    /* Error badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 50px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      font-size: 11px;
      color: rgba(239,68,68,0.8);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Floating fragments */
    .fragment {
      position: fixed;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.06);
      pointer-events: none;
      animation: fragmentFloat var(--dur) linear infinite;
      top: var(--top);
      left: var(--left);
    }

    @keyframes fragmentFloat {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      to   { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Floating code fragments -->
  <div class="fragment" style="--top:90%;--left:8%;--dur:18s;">404</div>
  <div class="fragment" style="--top:85%;--left:78%;--dur:22s;animation-delay:-7s">null</div>
  <div class="fragment" style="--top:80%;--left:45%;--dur:16s;animation-delay:-3s">undefined</div>
  <div class="fragment" style="--top:95%;--left:60%;--dur:20s;animation-delay:-11s">404</div>
  <div class="fragment" style="--top:88%;--left:25%;--dur:14s;animation-delay:-5s">NaN</div>

  <!-- Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <div class="badge"><div class="badge-dot"></div>Page Not Found</div>

    <div class="big-404">404</div>

    <div class="divider"></div>

    <h1>You're Lost in Space</h1>
    <p>The page you're looking for drifted off into the void. It may have moved, been deleted, or never existed at all.</p>

    <a href="https://sentra-3ca66.web.app/" class="btn">
      <svg viewBox="0 0 24 24"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      Back to Home
    </a>
  </div>

  <script>
    // Generate stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        --dur: ${Math.random() * 4 + 2}s;
        --delay: ${Math.random() * 5}s;
      `;
      starsEl.appendChild(s);
    }
  </script>
</body>
</html>
