name: sentra_app
description: Flutter app for Sentra ESP32 robot control via BLE with Egyptian Arabic voice commands
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.31.11
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  http: ^1.2.1
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - secrets/api.txt